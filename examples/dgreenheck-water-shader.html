<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgl - shaders - ocean</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<link type="text/css" rel="stylesheet" href="main.css">
	</head>
	<body>

        <div id="container"></div>
		<div id="info">
			<a href="https://threejs.org" target="_blank" rel="noopener">dgreenheck</a> - water shader
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.module.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

        <script type="module">

			import * as THREE from 'three';

			import { GUI } from 'three/addons/libs/lil-gui.module.min.js';
			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { Water } from 'three/addons/objects/dgreenheckWater.js';
            //import { Ground } from 'three/addons/objects/dgreenheckGround';

			let container;
			let camera, scene, renderer;
			let controls, water, sun, mesh;

			init();

			function init() {

				container = document.getElementById( 'container' );

                //Environment
                const environmentTexture = new THREE.CubeTextureLoader();
                environmentTexture.setPath( './textures/cube/Sunset/' );
                const environmentMap = environmentTexture.load( [ 'px.png', 'nx.png', 'py.png', 'ny.png', 'pz.png', 'nz.png' ] );


				//

				renderer = new THREE.WebGLRenderer();
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );
				renderer.toneMapping = THREE.ACESFilmicToneMapping;
				renderer.toneMappingExposure = 0.5;
				container.appendChild( renderer.domElement );

				//

				scene = new THREE.Scene();
                scene.environment = environmentMap;
				scene.background = environmentMap;


				camera = new THREE.PerspectiveCamera( 55, window.innerWidth / window.innerHeight, 1, 20000 );
				camera.position.set( 30, 30, 100 );


                const waterResolution = { size: 512 };
                const water = new Water({
                environmentMap,
                resolution: waterResolution.size
                });
                scene.add(water);


                //
/*
				sun = new THREE.Vector3();

                // Water

                // Skybox

                const sky = new Sky();
                sky.scale.setScalar( 10000 );
                scene.add( sky );

                const skyUniforms = sky.material.uniforms;

                skyUniforms[ 'turbidity' ].value = 10;
                skyUniforms[ 'rayleigh' ].value = 2;
                skyUniforms[ 'mieCoefficient' ].value = 0.005;
                skyUniforms[ 'mieDirectionalG' ].value = 0.8;

                const parameters = {
                    elevation: 3.7,
                    azimuth: 180
                };

                const pmremGenerator = new THREE.PMREMGenerator( renderer );
                const sceneEnv = new THREE.Scene();

                let renderTarget;

                function updateSun() {

                    const phi = THREE.MathUtils.degToRad( 90 - parameters.elevation );
                    const theta = THREE.MathUtils.degToRad( parameters.azimuth );

                    sun.setFromSphericalCoords( 1, phi, theta );

                    sky.material.uniforms[ 'sunPosition' ].value.copy( sun );

                    if ( renderTarget !== undefined ) renderTarget.dispose();

                    sceneEnv.add( sky );
                    renderTarget = pmremGenerator.fromScene( sceneEnv );
                    scene.add( sky );

                    scene.environment = renderTarget.texture;

                }

                updateSun();
*/
                //Mesh

                const geometry = new THREE.BoxGeometry( 30, 30, 30 );
                const material = new THREE.MeshStandardMaterial( { roughness: 0 } );

                mesh = new THREE.Mesh( geometry, material );
                scene.add( mesh );

                //

                controls = new OrbitControls( camera, renderer.domElement );
                controls.maxPolarAngle = Math.PI * 0.495;
                controls.target.set( 0, 10, 0 );
                controls.minDistance = 40.0;
                controls.maxDistance = 200.0;
                controls.update();

                //

/*
                // GUI

                const gui = new GUI();

                const folderSky = gui.addFolder( 'Sky' );
                folderSky.add( parameters, 'elevation', 0, 90, 0.1 ).onChange( updateSun );
                folderSky.add( parameters, 'azimuth', - 180, 180, 0.1 ).onChange( updateSun );
                folderSky.close();

                const waterUniforms = water.material.uniforms;

                const folderWater = gui.addFolder( 'Water' );
                folderWater.add( waterUniforms.distortionScale, 'value', 0, 8, 0.1 ).name( 'distortionScale' );
                folderWater.add( waterUniforms.size, 'value', 0.1, 10, 0.1 ).name( 'size' );
                folderWater.close();

                //
*/
                window.addEventListener( 'resize', onWindowResize );

                }

                function onWindowResize() {

                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();

                renderer.setSize( window.innerWidth, window.innerHeight );

                }

                function animate() {

                render();

                }

                function render() {

                const time = performance.now() * 0.001;

                renderer.render( scene, camera );

            }
            </script>

    </body>
</html>
